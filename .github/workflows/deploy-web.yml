name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project
        run: flutter create --platforms=web,ios --org com.tareq .

      - name: Fonts & icon
        run: bash tool/prepare.sh

      - name: Get packages
        run: flutter pub get

      - name: Web icons & PWA settings
        run: |
          dart run flutter_launcher_icons
          python3 tool/patch_web.py

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build web
        run: flutter build web --release --base-href /masrofi/ --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Update Rates

on:
  push:
    branches: [main]
    paths: ['tool/fetch_rates.py', '.github/workflows/rates.yml']
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices from sp-today.com
        run: python3 tool/fetch_rates.py > /tmp/rates.json && cat /tmp/rates.json

      - name: Publish to "rates" branch
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan rates-tmp
          git rm -rf -q .
          cp /tmp/rates.json rates.json
          git add rates.json
          git commit -q -m "rates $(date -u +%FT%TZ)"
          git push -f origin HEAD:rates
